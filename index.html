</div>
<audio id="audio" loop><source src="/music/song.mp3" type="audio/mpeg"></audio>
<div id="dbg"></div>
<script>
const CFG = { userId:'788083217244618802', displayName:'', username:'', bio:'DEVİL ONLY HELPS YOU İN HELL.', bgGif:'bg.gif' };
const $ = id => document.getElementById(id);
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function dbg(msg){ const e=$('dbg'); e.style.display='block'; e.textContent='⚠ '+msg; }
$('pName').textContent = CFG.displayName;
$('pTag').textContent  = '@' + CFG.username;
$('pBio').textContent  = CFG.bio;

const cursor = $('cursor');
document.addEventListener('mousemove', e => { cursor.style.left=(e.clientX-3.5)+'px'; cursor.style.top=(e.clientY-3.5)+'px'; cursor.classList.remove('hidden'); }, {passive:true});
document.addEventListener('mouseleave', () => cursor.classList.add('hidden'));
document.addEventListener('mouseenter', () => cursor.classList.remove('hidden'));
document.addEventListener('mouseover', e => {
  const t = e.target;
  if (t.tagName==='A'||t.tagName==='BUTTON'||t.closest('.music-btn')||t.id==='introEmoji'||t.classList.contains('vol-slider')||t.classList.contains('volume-icon')) cursor.classList.add('hover');
  else cursor.classList.remove('hover');
});

(function(){ let c=parseInt(localStorage.getItem('siteClickCount')||'0',10); c++; localStorage.setItem('siteClickCount',c); $('visitNum').textContent=c; setTimeout(()=>$('visitCount').classList.add('show'),200); })();

function updateClock(){ const n=new Date(); $('clockTime').textContent=n.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Istanbul'}); $('clockDate').textContent=n.toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long',timeZone:'Europe/Istanbul'}); }
updateClock(); setInterval(updateClock,1000);

let revealed=false, playing=false;
const audio=$('audio');

function reveal(){
  if(revealed)return; revealed=true;
  $('intro').classList.add('out');
  $('bg').style.backgroundImage=`url('${CFG.bgGif}')`;
  $('bio').classList.add('in');
  audio.volume=0.7;
  audio.play().then(()=>{ playing=true; showMusicBtn(true); }).catch(()=>showMusicBtn(false));
  const uid=String(CFG.userId||'').trim().replace(/[^0-9]/g,'');
  if(uid.length<15){dbg('Hata: CFG.userId geçersiz.');return;}
  CFG.userId=uid; fetchREST(); connectWS();
}

function showMusicBtn(isPlaying){
  $('musicBtn').style.display='flex';
  // Ata Otcuoglu In The Club!
  requestAnimationFrame(()=>requestAnimationFrame(()=>$('volumeWrap').classList.add('visible')));
  if(isPlaying){ $('musicBtn').classList.add('playing'); $('musicLabel').textContent='♪ #isbirligi'; $('sbar').classList.add('on'); }
}

function toggleMusic(){
  if(!playing){ audio.play().then(()=>{ playing=true; $('musicBtn').classList.add('playing'); $('musicLabel').textContent='♪ $isbirligi'; $('sbar').classList.add('on'); }); }
  else{ audio.pause(); playing=false; $('musicBtn').classList.remove('playing'); $('musicLabel').textContent='♪ music off'; $('sbar').classList.remove('on'); }
}

let lastVol=70;
function setVolume(val){ const v=parseInt(val,10); audio.volume=v/100; $('volNum').textContent=v; updateVolFill(v); updateVolIcon(v); if(v>0)lastVol=v; }
function updateVolFill(val){ $('volSlider').style.background=`linear-gradient(to right,rgba(255,255,255,.55) 0%,rgba(255,255,255,.55) ${val}%,rgba(255,255,255,.12) ${val}%)`; }
function updateVolIcon(val){ $('volIcon').textContent=val===0?'🔇':val<35?'🔈':val<70?'🔉':'🔊'; }
function toggleMute(){ const s=$('volSlider'),c=parseInt(s.value,10); if(c>0){lastVol=c;s.value=0;setVolume(0);}else{s.value=lastVol;setVolume(lastVol);} }
updateVolFill(70);

let spTick=null,acTick=null;
function fmt(ms){ const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60; return h>0?`${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`:`${m}:${String(sec).padStart(2,'0')}`; }

const CITIES=[{name:'İzmir/Urla',lat:38.4189,lon:26.7606},{name:'İstanbul',lat:41.0082,lon:28.9784},{name:'Ankara',lat:39.9334,lon:32.8597}];
const WMO_MAP={0:['☀️','açık'],1:['🌤️','az bulutlu'],2:['⛅','parçalı bulutlu'],3:['☁️','bulutlu'],45:['🌫️','sisli'],48:['🌫️','kırağılı sis'],51:['🌦️','çiseleme'],53:['🌦️','çiseleme'],55:['🌧️','yoğun çiseleme'],61:['🌧️','hafif yağmur'],63:['🌧️','yağmur'],65:['🌧️','kuvvetli yağmur'],71:['🌨️','hafif kar'],73:['❄️','kar'],75:['❄️','yoğun kar'],80:['🌧️','sağanak'],81:['🌧️','kuvvetli sağanak'],82:['⛈️','şiddetli sağanak'],95:['⛈️','fırtına'],96:['⛈️','dolu'],99:['⛈️','kuvvetli dolu']};

async function fetchWeather(){
  try{
    const res=await Promise.all(CITIES.map(c=>fetch(`https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}&current_weather=true&forecast_days=1&timezone=Europe%2FIstanbul`).then(r=>r.json())));
    $('weatherList').innerHTML=res.map((d,i)=>{ const cw=d.current_weather,temp=Math.round(cw.temperature),[icon,cond]=WMO_MAP[cw.weathercode]||['🌡️','—']; return `<div class="weather-row"><span class="weather-city">${CITIES[i].name}</span><span class="weather-icon">${icon}</span><span class="weather-temp">${temp}°C</span><span class="weather-cond">${cond}</span></div>`; }).join('');
  }catch(e){console.warn('Hava durumu alınamadı:',e.message);}
}
fetchWeather(); setInterval(fetchWeather,600000);

async function fetchREST(){ try{ const r=await fetch(`https://api.lanyard.rest/v1/users/${CFG.userId}`),j=await r.json(); if(!j.success){dbg('Lanyard: discord.gg/lanyard sunucusuna katıldın mı?');return;} $('dbg').style.display='none'; renderPresence(j.data); }catch(e){dbg('Lanyard bağlantı hatası: '+e.message);} }

let wsRetry=0;
function connectWS(){ const ws=new WebSocket('wss://api.lanyard.rest/socket'); let hb; ws.onopen=()=>{wsRetry=0;ws.send(JSON.stringify({op:2,d:{subscribe_to_id:CFG.userId}}));}; ws.onmessage=e=>{ let m;try{m=JSON.parse(e.data);}catch{return;} if(m.op===1)hb=setInterval(()=>ws.send(JSON.stringify({op:3})),m.d.heartbeat_interval); if(m.op===0&&(m.t==='INIT_STATE'||m.t==='PRESENCE_UPDATE')){$('dbg').style.display='none';renderPresence(m.d);} }; ws.onclose=()=>{clearInterval(hb);wsRetry=Math.min(wsRetry+1,6);setTimeout(connectWS,Math.pow(2,wsRetry)*500);}; ws.onerror=()=>ws.close(); }

function renderPresence(data){
  if(spTick){clearInterval(spTick);spTick=null;} if(acTick){clearInterval(acTick);acTick=null;}
  const u=data.discord_user,status=data.discord_status||'offline';
  if(u?.avatar){ const ext=u.avatar.startsWith('a_')?'gif':'png',src=`https://cdn.discordapp.com/avatars/${u.id}/${u.avatar}.${ext}?size=128`,ex=document.querySelector('.pfp'); if(ex){ex.src=src;}else{const img=document.createElement('img');img.className='pfp';img.src=src;img.alt='';const ph=$('pfpPh');if(ph)ph.parentNode.replaceChild(img,ph);} }
  $('sdot').className='sdot '+status;
  const badge=$('statusBadge');badge.className='status-badge '+status;
  const stMap={online:'çevrimiçi',idle:'boşta',dnd:'rahatsız etme',offline:'çevrimdışı'};
  $('statusText').textContent=stMap[status]||status;
  $('pName').textContent=u?.global_name||u?.username||CFG.displayName;
  $('pTag').textContent='@'+(u?.username||CFG.username);
  $('pBio').textContent=CFG.bio;
  const cust=data.activities?.find(a=>a.type===4);
  if(cust?.state||cust?.emoji?.name){$('csRow').style.display='flex';$('csEmoji').textContent=cust.emoji?.name||'';$('csText').textContent=cust.state||'';}else{$('csRow').style.display='none';}
  const spCard=$('kSpotify');
  const SPSVG=`<svg class="sp-logo" viewBox="0 0 24 24"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>`;
  const act=data.activities?.find(a=>a.type!==4&&a.type!==2);
  if(data.spotify){
    const sp=data.spotify,start=sp.timestamps?.start||Date.now(),end=sp.timestamps?.end||Date.now(),total=end-start;
    const artHTML=sp.album_art_url?`<img class="sp-art" src="${esc(sp.album_art_url)}" alt="">`:`<div class="sp-art">🎵</div>`;
    let actHTML='';
    if(act){ const tmap={0:'OYNUYOR',1:'YAYINDA',3:'İZLİYOR',5:'YARIŞIYOR'},lbl=tmap[act.type]||'AKTİF',appId=act.application_id,lgImg=act.assets?.large_image;
      let ico=`<div class="sp-act-icon">🎮</div>`;
      if(appId&&lgImg&&!lgImg.startsWith('spotify:')&&!lgImg.startsWith('mp:'))ico=`<div class="sp-act-icon"><img src="https://cdn.discordapp.com/app-assets/${appId}/${lgImg}.png" alt="" onerror="this.parentElement.innerHTML='🎮'"></div>`;
      else if(appId)ico=`<div class="sp-act-icon"><img src="https://cdn.discordapp.com/app-icons/${appId}/icon.png" alt="" onerror="this.parentElement.innerHTML='🎮'"></div>`;
      const hasEl=act.timestamps?.start;
      actHTML=`<div class="act-block"><div class="act-block-label">${lbl}</div><div class="sp-act-row">${ico}<div class="sp-act-texts"><div class="sp-act-name">${esc(act.name)}</div>${act.details?`<div class="sp-act-detail">${esc(act.details)}</div>`:''} ${act.state?`<div class="sp-act-state">${esc(act.state)}</div>`:''} ${hasEl?`<div class="sp-act-elapsed" id="acElSum"></div>`:''}</div></div></div>`;
      if(hasEl){const tk=()=>{const el=document.getElementById('acElSum');if(el)el.textContent=fmt(Date.now()-act.timestamps.start)+' elapsed';};tk();acTick=setInterval(tk,1000);}
    }
    spCard.innerHTML=`${actHTML}<div class="sp-section"><div class="sp-label">${SPSVG}Spotify dinliyor</div><div class="sp-row">${artHTML}<div class="sp-texts"><div class="sp-song">${esc(sp.song)}</div><div class="sp-artist">${esc(sp.artist)}</div><div class="sp-album">${esc(sp.album||'')}</div></div></div><div class="sp-prog-wrap"><div class="sp-prog-fill" id="spf" style="width:0%"></div></div><div class="sp-times"><span id="spe">0:00</span><span>${fmt(total)}</span></div></div>`;
    const tk=()=>{const f=$('spf'),t=$('spe');if(!f)return;const e=Math.min(Date.now()-start,total);f.style.width=(e/total*100)+'%';if(t)t.textContent=fmt(e);};tk();spTick=setInterval(tk,1000);
  } else if(act){
    const tmap2={0:'Oynuyor',1:'Yayında',3:'İzliyor',5:'Yarışıyor'},label=tmap2[act.type]||'Aktif',appId2=act.application_id,lgImg2=act.assets?.large_image;
    let ico2=`<div class="sp-act-icon"></div>`;
    if(appId2&&lgImg2&&!lgImg2.startsWith('spotify:')&&!lgImg2.startsWith('mp:'))ico2=`<div class="sp-act-icon"><img src="https://cdn.discordapp.com/app-assets/${appId2}/${lgImg2}.png" alt="" onerror="this.parentElement.innerHTML='🎮'"></div>`;
    else if(appId2)ico2=`<div class="sp-act-icon"><img src="https://cdn.discordapp.com/app-icons/${appId2}/icon.png" alt="" onerror="this.parentElement.innerHTML='🎮'"></div>`;
    const ht2=act.timestamps?.start;
    spCard.innerHTML=`<div class="act-block-label" style="margin-bottom:8px;">${label}</div><div class="sp-act-row">${ico2}<div class="sp-act-texts"><div class="sp-act-name">${esc(act.name)}</div>${act.details?`<div class="sp-act-detail">${esc(act.details)}</div>`:''} ${act.state?`<div class="sp-act-state">${esc(act.state)}</div>`:''} ${ht2?`<div class="sp-act-elapsed" id="acEl2"></div>`:''}</div></div>`;
    if(ht2){const tk2=()=>{const el=document.getElementById('acEl2');if(el)el.textContent=fmt(Date.now()-act.timestamps.start)+' elapsed';};tk2();acTick=setInterval(tk2,1000);}
  } else { spCard.innerHTML=`<div class="sp-empty">—</div>`; }
}
</script>
